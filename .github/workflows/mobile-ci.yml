name: Mobile CI

on:
  pull_request:
    branches: [develop, qa, main]
  push:
    branches: [develop, qa]

permissions:
  contents: read

jobs:
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:ci
      - name: Production web build
        run: npm run build

  build-android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm ci
      - name: Build development web assets
        run: npm run build -- --configuration development
      - name: Generate or synchronize Android platform
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
      - name: Allow local HTTP only in this debug artifact
        shell: bash
        run: |
          mkdir -p android/app/src/debug
          cat > android/app/src/debug/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:usesCleartextTraffic="true" />
          </manifest>
          EOF
      - name: Assemble debug APK
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pantrypal-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
